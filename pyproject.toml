[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-ml-dl-master-course"
version = "1.0.0"
description = "Offline-first Data Science, ML, DL, and MLOps self-study course"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
